<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<title>…</title>
</head>
<body data-page="gallery" data-title-key="nav.gallery">

  <div id="site-header"></div>

  <header class="page-header">
    <div class="container">
      <div class="eyebrow" data-i18n="pages.gallery.eyebrow"></div>
      <h1 class="section-title" data-i18n="pages.gallery.title"></h1>
    </div>
  </header>

  <section>
    <div class="container">
      <div id="gallery-grid" class="gallery-grid"></div>
    </div>
  </section>

  <div id="lightbox" class="lightbox">
    <button id="lightbox-close" class="lightbox-close">&times;</button>
    <button id="lightbox-prev" class="lightbox-prev">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <span class="lightbox-credit">&copy; Jean-Baptiste Millot</span>
    <button id="lightbox-next" class="lightbox-next">&#8250;</button>
  </div>

  <div id="site-footer"></div>

  <script src="js/data/content.js"></script>
  <script src="js/data/schedule.js"></script>
  <script src="js/data/press.js"></script>
  <script src="js/data/discography.js"></script>
  <script src="js/data/gallery.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
