<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<title>…</title>
</head>
<body data-page="contact" data-title-key="nav.contact">

  <div id="site-header"></div>

  <header class="page-header">
    <div class="container">
      <div class="eyebrow" data-i18n="pages.contact.eyebrow"></div>
      <h1 class="section-title" data-i18n="pages.contact.title"></h1>
    </div>
  </header>

  <section>
    <div class="container contact-grid">
      <div class="reveal">
        <p class="section-intro" data-i18n="pages.contact.formIntro" style="margin-bottom:2rem;"></p>

        <!--
          このフォームは Formspree（https://formspree.io）にPOSTされます。
          サイトのコード上にメールアドレスは一切含まれません。
          別のFormspreeフォームに差し替えたい場合は、action属性の
          URLを新しいFormエンドポイントに置き換えてください。
        -->
        <form id="contact-form" name="contact" method="POST" action="https://formspree.io/f/xjybkapd">
          <p style="display:none;"><label>Don't fill this out: <input name="_gotcha"></label></p>

          <div class="field">
            <label data-i18n="common.nameLabel"></label>
            <input type="text" name="name" required>
          </div>
          <div class="field">
            <label data-i18n="common.emailLabel"></label>
            <input type="email" name="email" required>
          </div>
          <div class="field">
            <label data-i18n="common.subjectLabel"></label>
            <input type="text" name="subject">
          </div>
          <div class="field">
            <label data-i18n="common.messageLabel"></label>
            <textarea name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-gold" data-i18n="common.sendMessage"></button>
          <p id="contact-thanks" style="display:none; margin-top:1rem; color:var(--color-gold);" data-i18n="pages.contact.sentThanks"></p>
          <p id="contact-error" style="display:none; margin-top:1rem; color:var(--color-ink-soft);" data-i18n="pages.contact.sendError"></p>
        </form>
      </div>

      <div class="reveal">
        <div class="social-row" id="contact-social"></div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data/content.js"></script>
  <script src="js/data/schedule.js"></script>
  <script src="js/data/press.js"></script>
  <script src="js/data/discography.js"></script>
  <script src="js/data/gallery.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("contact-form");
      const thanks = document.getElementById("contact-thanks");
      const errorMsg = document.getElementById("contact-error");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new FormData(form);
        fetch(form.action, {
          method: "POST",
          body: data,
          headers: { "Accept": "application/json" }
        }).then((response) => {
          if (response.ok) {
            thanks.style.display = "block";
            if (errorMsg) errorMsg.style.display = "none";
            form.reset();
          } else {
            if (errorMsg) errorMsg.style.display = "block";
          }
        }).catch(() => {
          if (errorMsg) errorMsg.style.display = "block";
        });
      });
    });
  </script>
</body>
</html>
